<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Staff Login — Zen Ceramic</title>
<link rel="icon" href="https://zenceramic.asia/wp-content/uploads/2025/12/Zen-Ceramic-Logo-Transparent-1000-x-1000-px-1.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://www.google.com/recaptcha/api.js?render=6Ld9dZgsAAAAAIXw1Q4S3VRYB9ngJywAi_CfO2tH"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:#FDF8F3;color:#2D2926;display:flex;align-items:center;justify-content:center;padding:20px}

.login-card{width:100%;max-width:380px;text-align:center}
.logo{height:56px;margin-bottom:12px}
.login-card h1{font-family:'Playfair Display',serif;font-size:24px;color:#2D2926;margin-bottom:4px}
.login-card .subtitle{font-size:13px;color:#7A7067;margin-bottom:32px}

.form-group{margin-bottom:16px;text-align:left}
.form-group label{display:block;font-size:12px;font-weight:600;color:#7A7067;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.form-group input{width:100%;padding:14px 16px;border:1.5px solid #E8E0D8;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:16px;color:#2D2926;background:#fff;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#C1714F}
.form-group input::placeholder{color:#BEB5AC}

.pin-inputs{display:flex;gap:10px;justify-content:center}
.pin-inputs input{width:56px;height:60px;text-align:center;font-size:24px;font-weight:700;padding:0;letter-spacing:0;border:1.5px solid #E8E0D8;border-radius:12px;font-family:'DM Sans',sans-serif;color:#2D2926;background:#fff;outline:none;transition:border-color .2s}
.pin-inputs input:focus{border-color:#C1714F;background:#FFF9F5}

.btn{width:100%;padding:16px;border:none;border-radius:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:8px}
.btn-primary{background:#C1714F;color:#fff}
.btn-primary:hover{background:#A85D3F}
.btn-primary:active{transform:scale(0.98)}
.btn-primary:disabled{background:#D4C5BC;cursor:not-allowed;transform:none}

.error-msg{color:#C0392B;font-size:13px;margin-top:12px;min-height:20px;transition:opacity .2s}
.error-msg:empty{opacity:0}

.loading{display:none;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:13px;color:#7A7067}
.loading.show{display:flex}
.spinner{width:16px;height:16px;border:2px solid #E8E0D8;border-top-color:#C1714F;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{margin-top:40px;font-size:11px;color:#BEB5AC}
</style>
</head>
<body>

<div class="login-card">
  <img class="logo" src="https://zenceramic.asia/wp-content/uploads/2025/12/Zen-Ceramic-Logo-Transparent-1000-x-1000-px-1.png" alt="Zen Ceramic">
  <h1>Staff Portal</h1>
  <p class="subtitle">Enter your phone number and PIN to log in</p>

  <div class="form-group">
    <label>Phone Number</label>
    <input type="tel" id="phone" placeholder="012-3456789" autocomplete="tel" inputmode="tel">
  </div>

  <div class="form-group">
    <label>4-Digit PIN</label>
    <div class="pin-inputs">
      <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="0" autocomplete="off">
      <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="1" autocomplete="off">
      <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="2" autocomplete="off">
      <input type="tel" maxlength="1" inputmode="numeric" class="pin-digit" data-idx="3" autocomplete="off">
    </div>
  </div>

  <button class="btn btn-primary" id="loginBtn" disabled>Log In</button>
  <div class="error-msg" id="error"></div>
  <div class="loading" id="loading"><div class="spinner"></div>Logging in…</div>

  <div class="footer">Zen Ceramic 陶艺 — Internal Use Only<br><span style="font-size:10px;color:#D4C5BC">Protected by reCAPTCHA</span></div>
</div>

<script>
// Hide reCAPTCHA badge (allowed by Google when attribution text is shown)
var style = document.createElement('style');
style.textContent = '.grecaptcha-badge{visibility:hidden!important}';
document.head.appendChild(style);
</script>

<script>
// ── CONFIG ──
var API_URL = "https://script.google.com/macros/s/AKfycbyUQnfr3H6buEBk0xH6Rv8ycY1casqT4P2wdNv45rrUjC-n99plmdWV6C_J6dOe9JZ7/exec";

// ── Check existing session ──
(function() {
  var session = sessionStorage.getItem("zc_staff");
  if (session) {
    try {
      var s = JSON.parse(session);
      if (s.phone && s.pin && s.name) {
        window.location.href = "app.html";
        return;
      }
    } catch(e) {}
  }
})();

// ── PIN input auto-advance ──
var pinDigits = document.querySelectorAll(".pin-digit");
var phoneInput = document.getElementById("phone");
var loginBtn = document.getElementById("loginBtn");
var errorEl = document.getElementById("error");
var loadingEl = document.getElementById("loading");

pinDigits.forEach(function(inp, i) {
  inp.addEventListener("input", function() {
    this.value = this.value.replace(/\D/g, "").slice(0, 1);
    if (this.value && i < 3) pinDigits[i + 1].focus();
    checkReady();
  });
  inp.addEventListener("keydown", function(e) {
    if (e.key === "Backspace" && !this.value && i > 0) {
      pinDigits[i - 1].focus();
      pinDigits[i - 1].value = "";
    }
    if (e.key === "Enter") attemptLogin();
  });
  // Handle paste
  inp.addEventListener("paste", function(e) {
    e.preventDefault();
    var text = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "");
    for (var j = 0; j < 4 && j < text.length; j++) {
      pinDigits[j].value = text[j];
    }
    if (text.length >= 4) pinDigits[3].focus();
    checkReady();
  });
});

phoneInput.addEventListener("input", checkReady);
phoneInput.addEventListener("keydown", function(e) {
  if (e.key === "Enter") {
    if (phoneInput.value.trim().length >= 10) pinDigits[0].focus();
  }
});

function getPin() {
  return Array.from(pinDigits).map(function(d) { return d.value; }).join("");
}

function checkReady() {
  var phone = phoneInput.value.replace(/\D/g, "");
  var pin = getPin();
  loginBtn.disabled = !(phone.length >= 10 && pin.length === 4);
}

// ── Login ──
loginBtn.addEventListener("click", attemptLogin);

function attemptLogin() {
  if (loginBtn.disabled) return;
  var phone = phoneInput.value.trim();
  var pin = getPin();

  errorEl.textContent = "";
  loginBtn.disabled = true;
  loadingEl.classList.add("show");

  // Get reCAPTCHA v3 token first, then send login
  grecaptcha.ready(function() {
    grecaptcha.execute("6Ld9dZgsAAAAAIXw1Q4S3VRYB9ngJywAi_CfO2tH", { action: "staff_login" })
      .then(function(token) {
        return fetch(API_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "staffLogin", phone: phone, pin: pin, recaptchaToken: token })
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        loadingEl.classList.remove("show");
        if (data.ok) {
          sessionStorage.setItem("zc_staff", JSON.stringify({
            phone: phone,
            pin: pin,
            name: data.staff.name,
            branchId: data.staff.branchId,
            role: data.staff.role,
            branches: data.branches,
          }));
          window.location.href = "app.html";
        } else {
          errorEl.textContent = data.error || "Login failed. Check your phone number and PIN.";
          loginBtn.disabled = false;
          document.querySelector(".pin-inputs").style.animation = "shake 0.4s";
          setTimeout(function() {
            document.querySelector(".pin-inputs").style.animation = "";
          }, 400);
        }
      })
      .catch(function(err) {
        loadingEl.classList.remove("show");
        errorEl.textContent = "Connection error — please try again.";
        loginBtn.disabled = false;
        console.error(err);
      });
  });
}
</script>

<style>
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-4px)}}
</style>

</body>
</html>
